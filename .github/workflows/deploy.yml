name: Build & Deploy Production Bundle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build & Package Game Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Standalone Game Bundle
        run: npm run build

      - name: Upload Production Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: feral-pig-hunt-production-bundle
          path: |
            Public/Feral_Pig_Hunt/
            public/Feral_Pig_Hunt/
            dist/
          retention-days: 30

      - name: Package Release Zip
        run: |
          mkdir -p release-output
          if [ -d "Public/Feral_Pig_Hunt" ]; then
            cd Public/Feral_Pig_Hunt && zip -r ../../release-output/Feral_Pig_Hunt_Bundle.zip . && cd ../..
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/Feral_Pig_Hunt_Bundle.zip
          tag_name: v0.5.0
          name: Feral Pig Hunt - Compiled Production Build v0.5.0
          body: |
            Automated production build generated by GitHub Actions.
            
            **Server Deployment Info:**
            - **VPS Repository**: `/home/fairiesd/Repositories/Feral-Pig-Hunt`
            - **Production URL Path**: `/home/fairiesd/public_html/Arcade/Feral_Pig_Hunt/`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
